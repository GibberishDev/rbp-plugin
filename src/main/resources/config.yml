# Whether to have all recipes discovered or let players learn recipes
recipe_discovery: true
# Recipe discovered and added to player knowledge book when they acquire result item
# (Ex: picking up a stick would grant player all recipes that have stick as a result)
recipe_discovery_result: true
# When acquiring any ingredient used in the recipe
# (Ex: picking up a stick would grant player all recipes that have stick as an ingredient (Sword, torch, campfire, etc.)
recipe_discovery_ingredient: true
# When certain criteria met. (VANILLA WAY)
# (Ex: advancement system based recipe discovery. Good example would be learning all boat recipes when touching water)
recipe_discovery_criterions: true